name: VIERNES - ciclo comercial autonomo

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viernes-ciclo-comercial
  cancel-in-progress: false

jobs:
  ejecutar-ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Verificar secreto
        env:
          VIERNES_TOKEN: ${{ secrets.VIERNES_PIPELINE_TOKEN }}
        run: |
          if [ -z "$VIERNES_TOKEN" ]; then
            echo "Falta el secreto VIERNES_PIPELINE_TOKEN"
            exit 1
          fi

      - name: Despertar servicio Render
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 15 \
            --max-time 180 \
            "https://proyecto-viernes.onrender.com/despertar" \
            > /dev/null

      - name: Ejecutar un ciclo comercial
        env:
          VIERNES_TOKEN: ${{ secrets.VIERNES_PIPELINE_TOKEN }}
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 300 \
            --request POST \
            --header "X-Pipeline-Token: $VIERNES_TOKEN" \
            "https://proyecto-viernes.onrender.com/agente/ciclo"
